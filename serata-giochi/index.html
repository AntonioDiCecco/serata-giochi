<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organizzatore Serate Giochi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1a202c; color: white; }
        
        /* Cella del calendario */
        .day-cell { min-height: 120px; cursor: pointer; transition: background 0.2s; display: flex; flex-direction: column; }
        .day-cell:hover { background-color: #2d3748; }
        
        /* Avatar Selezione */
        .user-avatar { transition: transform 0.2s; border: 2px solid transparent; }
        .user-avatar.selected { transform: scale(1.1); box-shadow: 0 0 15px currentColor; border-color: white; }
        
        /* Etichetta Utente nel Calendario */
        .user-chip {
            font-size: 0.75rem; 
            padding: 2px 6px; 
            border-radius: 4px; 
            margin-bottom: 2px; 
            color: #000; 
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
            overflow: hidden;
            box-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }

        /* Etichetta Campagna */
        .campaign-label { 
            font-size: 0.7rem; 
            background: #ecc94b; 
            color: #000; 
            padding: 2px 4px; 
            border-radius: 4px; 
            margin-top: auto; /* Spinge in basso */
            font-weight: bold;
            text-align: center;
            border: 1px solid #d69e2e;
        }
        
        /* Modale */
        .modal { display: none; position: fixed; z-index: 50; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.8); }
        .modal-content { background-color: #2d3748; margin: 5% auto; padding: 20px; border-radius: 10px; width: 95%; max-width: 450px; max-height: 90vh; overflow-y: auto; }
        
        /* Griglia Emoji */
        .emoji-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; }
        .emoji-opt { font-size: 1.5rem; cursor: pointer; border-radius: 5px; transition: bg 0.2s; text-align: center; }
        .emoji-opt:hover { background-color: #4a5568; }
        .emoji-opt.selected { background-color: #4299e1; }
    </style>
</head>
<body class="p-2 md:p-4 max-w-6xl mx-auto">

    <!-- Header -->
    <div class="text-center mb-6">
        <h1 class="text-3xl font-bold text-yellow-500 mb-2"><i class="fa-solid fa-dice-d20"></i> Serata Giochi</h1>
        <p class="text-gray-400 text-sm">1. Seleziona chi sei &nbsp;|&nbsp; 2. Clicca il giorno &nbsp;|&nbsp; 3. Dai disponibilità</p>
    </div>

    <!-- User Selection Section -->
    <div class="bg-gray-800 p-4 rounded-lg shadow-lg mb-6 border border-gray-700">
        <div id="users-container" class="flex flex-wrap gap-4 justify-center items-center">
            <!-- Gli utenti verranno caricati qui -->
        </div>
        <div class="mt-4 text-center">
            <button onclick="openNewUserModal()" class="bg-blue-600 hover:bg-blue-500 text-white px-6 py-2 rounded-full text-sm transition font-bold shadow-lg">
                <i class="fa-solid fa-plus"></i> Nuovo Giocatore
            </button>
        </div>
    </div>

    <!-- Calendar Controls -->
    <div class="flex justify-between items-center mb-4 px-2">
        <button onclick="changeMonth(-1)" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded shadow"><i class="fa-solid fa-chevron-left"></i></button>
        <h2 id="month-year-display" class="text-2xl font-bold capitalize text-white"></h2>
        <button onclick="changeMonth(1)" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded shadow"><i class="fa-solid fa-chevron-right"></i></button>
    </div>

    <!-- Calendar Grid -->
    <div class="grid grid-cols-7 gap-1 text-center mb-2 font-bold text-gray-400 text-sm uppercase">
        <div>Lun</div><div>Mar</div><div>Mer</div><div>Gio</div><div>Ven</div><div>Sab</div><div>Dom</div>
    </div>
    <div id="calendar-grid" class="grid grid-cols-7 gap-1 bg-gray-700 p-1 rounded-lg border border-gray-600">
        <!-- I giorni verranno generati qui -->
    </div>

    <!-- Modal Day Details -->
    <div id="dayModal" class="modal flex items-center justify-center">
        <div class="modal-content relative shadow-2xl border border-gray-600">
            <span onclick="closeModal('dayModal')" class="absolute top-2 right-4 text-3xl cursor-pointer text-gray-400 hover:text-white">&times;</span>
            <h3 id="modalDateTitle" class="text-2xl font-bold mb-6 text-center text-yellow-500">Data</h3>
            
            <!-- Disponibilità Utente Corrente -->
            <div id="availabilitySection" class="mb-6 text-center hidden">
                <button id="toggleBtn" onclick="toggleMyAvailability()" class="w-full py-4 rounded-lg font-bold text-xl transition border-4 shadow-lg transform active:scale-95">
                    Caricamento...
                </button>
            </div>
            <div id="loginWarning" class="mb-6 text-center p-4 bg-red-900/50 rounded border border-red-500 text-red-200">
                ⚠️ Seleziona prima il tuo nome nella lista in alto!
            </div>

            <!-- Lista Presenti nel Modale -->
            <div class="mb-6 bg-gray-900 p-3 rounded">
                <p class="text-sm text-gray-400 mb-2 uppercase font-bold">Chi c'è:</p>
                <div id="modalUserList" class="flex flex-wrap gap-2"></div>
            </div>

            <hr class="border-gray-600 mb-4">
            
            <!-- Note Campagna -->
            <div class="mb-2">
                <label class="block text-sm text-gray-400 mb-1 font-bold">🏷️ Titolo Serata / Campagna (Visibile a tutti)</label>
                <div class="flex gap-2">
                    <input type="text" id="campaignInput" class="w-full p-3 rounded bg-gray-800 border border-gray-600 focus:outline-none focus:border-yellow-500 text-white" placeholder="Es. Gloomhaven, D&D, Party Game...">
                    <button onclick="saveCampaignNote()" class="bg-yellow-600 hover:bg-yellow-500 px-4 rounded text-white font-bold"><i class="fa-solid fa-save"></i></button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal New User -->
    <div id="userModal" class="modal flex items-center justify-center">
        <div class="modal-content relative shadow-2xl border border-gray-600">
            <span onclick="closeModal('userModal')" class="absolute top-2 right-4 text-3xl cursor-pointer text-gray-400 hover:text-white">&times;</span>
            <h3 class="text-xl font-bold mb-4 text-blue-400">Crea la tua Identità</h3>
            
            <input type="text" id="newUserName" placeholder="Il tuo nome" class="w-full p-3 mb-4 rounded bg-gray-900 border border-gray-600 text-white focus:border-blue-500 outline-none text-lg">
            
            <p class="mb-2 text-sm text-gray-400">Scegli la tua Icona (Colore assegnato in automatico):</p>
            <div id="emojiContainer" class="emoji-grid mb-6 bg-gray-800 p-2 rounded max-h-48 overflow-y-auto">
                <!-- Emoticons generate via JS -->
            </div>

            <button onclick="createNewUser()" class="w-full bg-blue-600 hover:bg-blue-500 py-3 rounded font-bold text-white text-lg shadow-lg">
                CREA GIOCATORE
            </button>
        </div>
    </div>

    <!-- Firebase Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, set, update, push } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // -------------------------------------------------------------
        // --- INCOLLA QUI SOTTO LA TUA CONFIGURAZIONE FIREBASE ---
		// Your web app's Firebase configuration
		const firebaseConfig = {
		  apiKey: "AIzaSyDqCTGNtlQcTZ03tEa2oLWz9yabVhT5AiU",
		  authDomain: "serata-giochi-ceb8c.firebaseapp.com",
		  databaseURL: "https://serata-giochi-ceb8c-default-rtdb.europe-west1.firebasedatabase.app",
		  projectId: "serata-giochi-ceb8c",
		  storageBucket: "serata-giochi-ceb8c.firebasestorage.app",
		  messagingSenderId: "575037425014",
		  appId: "1:575037425014:web:df652f02d5c85010b22657"
		};
        // -------------------------------------------------------------

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // --- VARIABILI GLOBALI ---
        let users = {};
        let availabilityData = {}; 
        let currentUserId = localStorage.getItem('boardgame_selected_user'); 
        let currentDate = new Date();
        let selectedDayKey = null;
        let selectedNewEmoji = '🎲'; // Default

        // --- LISTE PREDEFINITE ---
        const emojis = [
            '🧙‍♂️','🧝‍♀️','🧛','🧟','🐉','🐺','🦄','👽','🤖','🤠','🕵️‍♂️','👨‍🚀',
            '⚔️','🛡️','🏹','🧪','🔮','🗡️','🎩','👑','💀','🤡','👻','👹',
            '🎲','♟️','🎯','🧩','🎮','🕹️','🎰','🃏','🎱','🍺','🍕','🥓',
            '🐈','🐕','🐙','🦖','🍄','🌲','🔥','⚡','💎','💰','📜','🔑'
        ];

        // Colori pastello/vivaci per sfondo (testo sarà nero)
        const colors = [
            '#fc8181', '#f687b3', '#b794f4', '#63b3ed', '#76e4f7', '#68d391', 
            '#f6e05e', '#f6ad55', '#e2e8f0', '#9ae6b4', '#feb2b2', '#d6bcfa',
            '#90cdf4', '#81e6d9', '#faf089', '#fbd38d', '#a0aec0', '#c6f6d5'
        ];

        // --- GESTIONE UTENTI ---
        const usersRef = ref(db, 'users');
        onValue(usersRef, (snapshot) => {
            users = snapshot.val() || {};
            renderUsers();
            renderCalendar();
            if(selectedDayKey) updateModalState();
        });

        window.renderUsers = function() {
            const container = document.getElementById('users-container');
            container.innerHTML = '';
            
            for (const [id, user] of Object.entries(users)) {
                const isSelected = id === currentUserId;
                const div = document.createElement('div');
                div.className = `user-avatar flex flex-col items-center cursor-pointer p-2 rounded-lg ${isSelected ? 'selected bg-gray-700' : 'opacity-60 hover:opacity-100'}`;
                // Applica il colore dell'utente al bordo/testo quando selezionato
                if(isSelected) div.style.color = user.color;
                
                div.onclick = () => selectUser(id);
                div.innerHTML = `
                    <div class="text-4xl mb-1 filter drop-shadow-md">${user.emoji}</div>
                    <div class="font-bold text-xs bg-gray-900 px-2 py-1 rounded" style="color: ${user.color}">${user.name}</div>
                `;
                container.appendChild(div);
            }
        };

        window.selectUser = function(id) {
            currentUserId = id;
            localStorage.setItem('boardgame_selected_user', id);
            renderUsers();
            // Aggiorna modale se aperto
            const loginWarn = document.getElementById('loginWarning');
            const availSec = document.getElementById('availabilitySection');
            if(loginWarn && availSec) {
                loginWarn.classList.add('hidden');
                availSec.classList.remove('hidden');
                updateModalState();
            }
        };

        // --- GESTIONE CALENDARIO ---
        const availRef = ref(db, 'calendar');
        onValue(availRef, (snapshot) => {
            availabilityData = snapshot.val() || {};
            renderCalendar();
            if(selectedDayKey) updateModalState();
        });

        window.changeMonth = function(offset) {
            currentDate.setMonth(currentDate.getMonth() + offset);
            renderCalendar();
        };

        window.renderCalendar = function() {
            const grid = document.getElementById('calendar-grid');
            const monthDisplay = document.getElementById('month-year-display');
            grid.innerHTML = '';

            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            const formatter = new Intl.DateTimeFormat('it-IT', { month: 'long', year: 'numeric' });
            monthDisplay.innerText = formatter.format(currentDate);

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            let startingSlot = firstDay === 0 ? 6 : firstDay - 1;

            // Slot vuoti
            for (let i = 0; i < startingSlot; i++) {
                grid.innerHTML += `<div class="bg-gray-800/50 rounded"></div>`;
            }

            // Giorni
            for (let day = 1; day <= daysInMonth; day++) {
                const dateKey = `${year}-${String(month+1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const dayData = availabilityData[dateKey] || {};
                const note = dayData.note || "";
                const userAvails = dayData.users || {};

                // Genera le chip (etichette) utenti
                let chipsHtml = '';
                for(const [uid, status] of Object.entries(userAvails)) {
                    if(status && users[uid]) {
                        const u = users[uid];
                        chipsHtml += `
                            <div class="user-chip" style="background-color: ${u.color};">
                                <span>${u.emoji}</span> <span>${u.name}</span>
                            </div>`;
                    }
                }
                
                let borderClass = "border-transparent";
                if (note) borderClass = "border-yellow-500"; // Bordo dorato se c'è campagna

                grid.innerHTML += `
                    <div class="day-cell bg-gray-800 rounded p-1 border-2 ${borderClass}" onclick="openDayModal('${dateKey}', ${day})">
                        <div class="flex justify-between items-start mb-1 px-1">
                            <span class="font-bold text-gray-500 text-sm">${day}</span>
                        </div>
                        <div class="flex flex-col gap-1 overflow-hidden w-full px-1">
                            ${chipsHtml}
                        </div>
                        ${note ? `<div class="campaign-label">${note}</div>` : ''}
                    </div>
                `;
            }
        };

        // --- LOGICA MODALE GIORNO ---
        window.openDayModal = function(dateKey, day) {
            selectedDayKey = dateKey;
            document.getElementById('dayModal').style.display = 'flex';
            document.getElementById('modalDateTitle').innerText = 
                new Date(dateKey).toLocaleDateString('it-IT', {weekday:'long', day:'numeric', month:'long'});
            
            const loginWarn = document.getElementById('loginWarning');
            const availSec = document.getElementById('availabilitySection');

            if(currentUserId) {
                loginWarn.classList.add('hidden');
                availSec.classList.remove('hidden');
                updateModalState();
            } else {
                loginWarn.classList.remove('hidden');
                availSec.classList.add('hidden');
                // Pulisci lista utenti modale anche se non loggato
                updateModalUserList(); 
            }
            
            // Note
            const dayData = availabilityData[dateKey] || {};
            document.getElementById('campaignInput').value = dayData.note || '';
        };

        window.updateModalState = function() {
            if(!selectedDayKey) return;
            
            // Aggiorna bottone availability
            if (currentUserId) {
                const dayData = availabilityData[selectedDayKey] || {};
                const userAvails = dayData.users || {};
                const isAvailable = userAvails[currentUserId] === true;
                const btn = document.getElementById('toggleBtn');
                
                if(isAvailable) {
                    btn.innerText = "PRESENTE! 🤩";
                    btn.className = "w-full py-4 rounded-lg font-bold text-xl transition border-4 border-green-500 bg-green-600 text-white shadow-[0_0_20px_rgba(72,187,120,0.6)]";
                } else {
                    btn.innerText = "NON CI SONO 😴";
                    btn.className = "w-full py-4 rounded-lg font-bold text-xl transition border-4 border-gray-600 bg-gray-700 text-gray-400 hover:bg-gray-600";
                }
            }

            updateModalUserList();
        };

        function updateModalUserList() {
            const listContainer = document.getElementById('modalUserList');
            listContainer.innerHTML = '';
            const dayData = availabilityData[selectedDayKey] || {};
            const userAvails = dayData.users || {};
            
            let count = 0;
            for(const [uid, status] of Object.entries(userAvails)) {
                if(status && users[uid]) {
                    const u = users[uid];
                    count++;
                    listContainer.innerHTML += `
                        <div class="user-chip text-lg px-3 py-1" style="background-color: ${u.color};">
                            ${u.emoji} ${u.name}
                        </div>`;
                }
            }
            if(count === 0) listContainer.innerHTML = '<span class="text-gray-500 italic">Nessuno ancora...</span>';
        }

        window.toggleMyAvailability = function() {
            if(!selectedDayKey || !currentUserId) return;
            const dayRef = ref(db, `calendar/${selectedDayKey}/users/${currentUserId}`);
            
            const dayData = availabilityData[selectedDayKey] || {};
            const currentStatus = (dayData.users && dayData.users[currentUserId]) === true;

            set(dayRef, !currentStatus);
        };

        window.saveCampaignNote = function() {
            if(!selectedDayKey) return;
            const text = document.getElementById('campaignInput').value;
            const noteRef = ref(db, `calendar/${selectedDayKey}/note`);
            set(noteRef, text);
            closeModal('dayModal');
        };

        // --- LOGICA NUOVO UTENTE & COLORI AUTO ---
        
        // Popola la griglia emoji
        function renderEmojiGrid() {
            const container = document.getElementById('emojiContainer');
            container.innerHTML = '';
            emojis.forEach(e => {
                const span = document.createElement('div');
                span.className = `emoji-opt ${e === selectedNewEmoji ? 'selected' : ''}`;
                span.innerText = e;
                span.onclick = () => {
                    selectedNewEmoji = e;
                    renderEmojiGrid(); // Re-render per evidenziare selezione
                };
                container.appendChild(span);
            });
        }

        // Trova un colore non usato
        function getAutoColor() {
            const usedColors = Object.values(users).map(u => u.color);
            // Filtra colori che NON sono nella lista degli usati
            const available = colors.filter(c => !usedColors.includes(c));
            
            if (available.length > 0) {
                // Prendi uno a caso tra i disponibili
                return available[Math.floor(Math.random() * available.length)];
            } else {
                // Se finiti, prendi uno a caso tra tutti
                return colors[Math.floor(Math.random() * colors.length)];
            }
        }

        window.openNewUserModal = () => {
            document.getElementById('userModal').style.display = 'flex';
            renderEmojiGrid();
        };

        window.createNewUser = function() {
            const name = document.getElementById('newUserName').value;
            if(!name) return alert("Inserisci un nome!");
            
            const autoColor = getAutoColor();

            const newUserRef = push(ref(db, 'users'));
            set(newUserRef, {
                name: name,
                emoji: selectedNewEmoji,
                color: autoColor
            });
            
            selectUser(newUserRef.key);
            closeModal('userModal');
            document.getElementById('newUserName').value = '';
        };

        window.closeModal = (id) => {
            document.getElementById(id).style.display = 'none';
            selectedDayKey = null;
        };
        
        window.onclick = function(event) {
            if (event.target.classList.contains('modal')) {
                event.target.style.display = "none";
                selectedDayKey = null;
            }
        }
    </script>
</body>
</html>
